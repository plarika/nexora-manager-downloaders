name: Build Nexora Downloaders

on:
  workflow_dispatch:
  push:
    branches:
      - 'nexora/**'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build unsigned release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          apk="build/outputs/apk/release/nexora-manager-downloaders-1.2.0-nexora.1.apk"
          test -f "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" "build/outputs/apk/release/nexora-manager-downloaders-1.2.0-nexora.1-unsigned.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: nexora-manager-downloaders-1.2.0-nexora.1-unsigned
          path: build/outputs/apk/release/nexora-manager-downloaders-1.2.0-nexora.1-unsigned.apk
          archive: false
