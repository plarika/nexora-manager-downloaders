name: Bug report
description: Report a Nexora Manager Downloaders bug.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Nexora Manager Downloaders bug report
        Search existing issues first and provide enough detail to reproduce the problem.
  - type: textarea
    attributes:
      label: Bug description
      description: What happened, what did you expect, and how can it be reproduced?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and logs
      description: Include Android/Nexora versions, downloader source, and relevant logs.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Acknowledgements
      options:
        - label: I checked existing issues and this is not a duplicate.
          required: true
        - label: This issue is related to Nexora Manager Downloaders.
          required: true